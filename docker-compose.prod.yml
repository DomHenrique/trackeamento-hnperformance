services:
  redis:
    image: redis:7.2-alpine
    container_name: tracking_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - tracking_redis_data:/data
    networks:
      - tracking_internal

  postgres:
    image: postgres:16-alpine
    container_name: tracking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking_db}
      POSTGRES_USER: ${POSTGRES_USER:-tracking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tracking_postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    networks:
      - tracking_internal

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: tracking_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracking_events}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - tracking_clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - tracking_internal

  api:
    image: tracking-engine-api:production
    container_name: tracking_api
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    environment:
      - ENV=production
      - TRACKING_DOMAIN=${TRACKING_DOMAIN:-trackeamento.hnperformancedigital.com.br}
      - HTTP_PORT=8080
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_API_KEY=${SERVER_API_KEY}
      - HMAC_PEPPER=${HMAC_PEPPER}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tracking_db}
      - POSTGRES_USER=${POSTGRES_USER:-tracking_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSLMODE=disable
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-tracking_events}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - SEED_DEFAULT_SITE=${SEED_DEFAULT_SITE:-false}
      - DEFAULT_CLIENT_NAME=${DEFAULT_CLIENT_NAME:-HN Performance Digital}
      - DEFAULT_SITE_NAME=${DEFAULT_SITE_NAME:-Site Principal}
      - DEFAULT_SITE_DOMAIN=${DEFAULT_SITE_DOMAIN:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202609}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=rede_gridd"
      - "traefik.http.routers.tracking-api.entrypoints=websecure"
      - "traefik.http.routers.tracking-api.rule=Host(`${TRACKING_DOMAIN:-trackeamento.hnperformancedigital.com.br}`)"
      - "traefik.http.routers.tracking-api.tls=true"
      - "traefik.http.routers.tracking-api.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.tracking-api.loadbalancer.server.port=8080"
    networks:
      - tracking_internal
      - rede_gridd

  ingester:
    image: tracking-engine-ingester:production
    container_name: tracking_ingester
    restart: unless-stopped
    depends_on:
      - redis
      - clickhouse
    environment:
      - ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_API_KEY=${SERVER_API_KEY}
      - HMAC_PEPPER=${HMAC_PEPPER}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tracking_db}
      - POSTGRES_USER=${POSTGRES_USER:-tracking_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSLMODE=disable
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-tracking_events}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - INGESTER_BATCH_SIZE=2000
      - INGESTER_FLUSH_INTERVAL_SEC=2
    networks:
      - tracking_internal

  dispatcher:
    image: tracking-engine-dispatcher:production
    container_name: tracking_dispatcher
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    environment:
      - ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_API_KEY=${SERVER_API_KEY}
      - HMAC_PEPPER=${HMAC_PEPPER}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tracking_db}
      - POSTGRES_USER=${POSTGRES_USER:-tracking_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSLMODE=disable
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - DISPATCHER_WORKERS=8
      - DISPATCHER_MAX_RETRIES=5
      - DISPATCHER_TIMEOUT_SEC=10
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202609}
    networks:
      - tracking_internal

  caddy:
    image: caddy:2.8-alpine
    container_name: tracking_caddy
    restart: unless-stopped
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tracking_internal
      - rede_gridd
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=rede_gridd"
      # TCP Passthrough HTTPS para que o Caddy gerencie o TLS On-Demand com Let's Encrypt
      - "traefik.tcp.routers.tracking-caddy.entrypoints=websecure"
      - "traefik.tcp.routers.tracking-caddy.rule=HostSNIRegexp(`^track\\..+`)"
      - "traefik.tcp.routers.tracking-caddy.tls.passthrough=true"
      - "traefik.tcp.routers.tracking-caddy.service=tracking-caddy-service"
      - "traefik.tcp.services.tracking-caddy-service.loadbalancer.server.port=443"
      # Roteamento HTTP para validação ACME HTTP-01 e redirecionamento
      - "traefik.http.routers.tracking-caddy-http.entrypoints=web"
      - "traefik.http.routers.tracking-caddy-http.rule=HostRegexp(`^track\\..+`)"
      - "traefik.http.routers.tracking-caddy-http.service=tracking-caddy-http-service"
      - "traefik.http.services.tracking-caddy-http-service.loadbalancer.server.port=80"

volumes:
  tracking_redis_data:
  tracking_postgres_data:
  tracking_clickhouse_data:
  caddy_data:
  caddy_config:

networks:
  tracking_internal:
    driver: bridge
  rede_gridd:
    external: true

